<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeans1</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.min.css">
    <script defer src="js/index.js"></script>
</head>

<body>

    <!-- Header -->
    <header class="header">
        <nav class="header__nav flex-row">
            <div class="header__block block flex-row">
                <img class="logo__image" src="../media/1-Portada/logo.png" alt="logo">
                <button id="menu--icon" class="menu--icon">
                    <i class="ri-equal-line icon"></i>
                </button>
            </div>
        </nav>
    </header>

    <!-- Product area -->
    <main class="main">
        <section class="jeans flex-column">
            <div class="jeans__block flex-row">
                <div class="product__block flex-column">
                    <div class="heading__product flex-row">
                        <h2 class="jeans__title">Pixeljeans 01</h2>
                        <span>€ 270,00</span>
                    </div>
                    <div class="jeans__imgs flex-row">
                        <picture class="jeans__img">
                            <img src="media/Shop/jeans1-front.png" alt="jeans-front">
                        </picture>
                        <picture class="jeans__img">
                            <img src="media/Shop/jeans1-retro.png" alt="jeans-retro">
                        </picture>
                    </div>
                </div>

                <!-- Reservation form -->
                <div class="product__info flex-column">
                    <form action="" method="get" class="jeans__form">
                        <div class="form--area flex-column">
                            <div class="email--area flex-row">
                                <label class="email" for="email">Enter you email:</label>
                                <input name="email" id="email" type="email">
                            </div>
                            <div class="email--submission flex-column">
                                <textarea name="message" id="message" class="message">Write us your sizes to reserve your personal Pixeljeans</textarea>
                                <input type="submit">
                            </div>
                        </div>
                    </form>
                    <picture class="sizes-table">
                        <img class="table__image" src="media/Shop/sizes-table.png" alt="sizes-table">
                    </picture>
                    <a class="back--icon" href="shop.html"><i class="ri-arrow-go-back-fill"></i></a>

                </div>
            </div>
        </section>

        <!-- Menu pop-up -->
        <div id="menu--popup" class="menu--popup">
            <button id="close--btn" class="close--btn">
                <a class="icon__link" href="#">
                    <i class="ri-close-large-line icon"></i>
                </a>
            </button>
            <div class="menu__content">
                <ul class="menu__list">
                    <li class="menu__element flex-column">
                        <a class="menu__item" href="index.html">Home</a>
                        <a class="menu__item" href="about.html">About</a>
                        <a class="menu__item" href="room.html">Room</a>
                        <a class="menu__item" href="shop.html">Shop</a>
                        <a class="menu__item" href="contacts.html">Contacts</a>
                    </li>
                </ul>
            </div>
        </div>
    </main>
</body>
</html>
