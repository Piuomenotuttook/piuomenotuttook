<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.min.css">
    <script defer src="js/index.js"></script>
</head>

<body>
    
    <!-- Header -->
    <header id="header" class="header">
        <nav class="header__nav flex-row">
            <div class="header__block block flex-row">
                <picture class="logo__image">
                    <img loading="lazy" class="logo__img" src="media/1-Portada/logo.png" alt="logo">
                    <source src="media/1-Portada/logo.png">
                </picture>
                <button id="menu--button" class="menu--button" aria-label="abrir menu">
                    <i class="ri-equal-line icon"></i>
                </button>
            </div>
        </nav>
    </header>

    <!-- Portada --> 
    <main class="main">
        <div id="portada" class="portada">
            <div id="portada--background" class="portada--background flex-column">
                <div id="overlay" class="overlay"></div>
                <div class="background">
                    <i class="ri-arrow-down-double-fill arrow-down"></i>
                    <a class="btn__link" href="shop.html">
                        <img loading="lazy" id="portada__btn" class="portada__btn" src="media/1-Portada/btn_1-mask.png" alt="btn_1">
                    </a>
                    <picture class="portada__picture">
                        <img loading="lazy" class="portada__img" src="media/1-Portada/Portada_1-full.jpg" alt="portada">
                    </picture>
                </div>
            </div>

            <!-- Menu pop-up -->
            <div id="menu--popup" class="menu--popup hidden"> 
                    <a id="close--btn" class="close--btn" href="#" aria-label="close" role="button">
                        <i class="ri-close-large-line icon"></i>
                    </a>
                <div class="menu__content">
                    <ul class="menu__list">
                        <li class="menu__element flex-column">
                            <a class="menu__item" href="index.html">Home</a>
                            <a class="menu__item" href="about.html">About</a>
                            <a class="menu__item" href="room.html">Room</a>
                            <a class="menu__item" href="shop.html">Shop</a>
                            <a class="menu__item" href="contacts.html">Contacts</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>    
</body>
</html>
