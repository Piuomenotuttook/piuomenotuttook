<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.min.css">
    <script defer src="js/index.js"></script>
</head>

<body>

    <!-- Header -->
    <header class="header">
        <nav class="header__nav flex-row">
            <div class="header__block block flex-row">
                <img class="logo__image" src="../media/1-Portada/logo.png" alt="logo">
                <button id="menu--icon" class="menu--icon">
                    <i class="ri-equal-line icon"></i>
                </button>
            </div>
        </nav>
    </header>

    <!-- Room Carousel -->
    <main class="main">
        <section class="room flex-row">
            <div id="room__carousel flex-column" class="room__carousel flex-column">
                <picture class="carousel__imgs">
                    <img id="image-up" src="media/2-Pag1_arriba/img1.jpeg" alt="image-up">
                </picture>
                <picture class="carousel__imgs">
                    <img id="image-down" src="media/3-Pag1_abajo/img1.jpeg" alt="image-down">
                </picture>               
            </div>
        </section>

        <!-- Menu pop-up -->
        <div id="menu--popup" class="menu--popup">
            <button id="close--btn" class="close--btn">
                <a class="icon__link" href="#">
                    <i class="ri-close-large-line icon"></i>
                </a>
            </button>
            <div class="menu__content">
                <ul class="menu__list">
                    <li class="menu__element flex-column">
                        <a class="menu__item" href="index.html">Home</a>
                        <a class="menu__item" href="about.html">About</a>
                        <a class="menu__item" href="room.html">Room</a>
                        <a class="menu__item" href="shop.html">Shop</a>
                        <a class="menu__item" href="contacts.html">Contacts</a>
                    </li>
                </ul>
            </div>
        </div>
    </main>
</body>
</html>
